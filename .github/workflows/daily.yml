name: 페이지 갱신

on:
  schedule:
    # UTC 22:40 = KST 07:40 (화~토) → 전일 미국 종가가 확정된 뒤 아침 브리핑 직전
    - cron: "40 22 * * 1-5"
    # UTC 09:40 = KST 18:40 (월~금) → 한국장 마감 뒤
    - cron: "40 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8          # yfinance가 행에 걸려도 러너를 물고 있지 않게 한다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 페이지 생성
        run: python build.py
      - name: 변경분만 커밋
        run: |
          if git diff --quiet -- index.html; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: 시세 자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          git push
